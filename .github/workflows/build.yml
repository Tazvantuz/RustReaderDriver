name: Build Windows Driver

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC Environment and Build
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        msbuild src\RustReader.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=x64

    - name: Upload built driver
      uses: actions/upload-artifact@v4
      with:
        name: RustReader-Driver
        path: src\x64\Release\RustReader.sys
