name: Build Windows Driver

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile Driver directly
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        
        set WDK_INC=C:\Program Files (x86)\Windows Kits\10\Include\10.0.22621.0
        set WDK_LIB=C:\Program Files (x86)\Windows Kits\10\Lib\10.0.22621.0
        
        echo --- COMPILING ---
        cl.exe /c /GS- /Zl /I"%WDK_INC%\km" /I"%WDK_INC%\shared" /I"%WDK_INC%\ucrt" /D_WIN64 /D_WIN32_WINNT=0x0A00 src\Driver.c /Fo:Driver.obj
        
        echo --- LINKING ---
        link.exe /OUT:RustReader.sys /SUBSYSTEM:NATIVE /DRIVER /ENTRY:DriverEntry /MACHINE:X64 /NODEFAULTLIB Driver.obj "%WDK_LIB%\km\x64\ntoskrnl.lib" "%WDK_LIB%\km\x64\hal.lib" "%WDK_LIB%\km\x64\BufferOverflowK.lib"

    - name: Upload built driver
      uses: actions/upload-artifact@v4
      with:
        name: RustReader-Driver
        path: RustReader.sys
